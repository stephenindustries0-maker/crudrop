<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment - CruDrop</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  .bank-details-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 24px; position: relative; }
  .copy-btn { position: absolute; top: 20px; right: 20px; background: var(--accent-light); color: var(--accent); border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .upload-box { border: 2px dashed var(--border); border-radius: 16px; padding: 32px 20px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.02); margin-bottom: 20px; }
  .upload-box:hover { border-color: var(--accent); background: var(--accent-light); }
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--accent); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 14px; box-shadow: 0 4px 15px rgba(255,87,34,0.4); z-index: 9999; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 8px; }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#FF5722"></head>
<body>
<div id="toast"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="3" fill="none"><polyline points="20 6 9 17 4 12"/></svg> Copied!</div>

<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-brand"><h1>Cru<span>Drop</span></h1><button class="close-btn mobile-only" onclick="toggleSidebar()">✕</button></div>
  <div class="sidebar-menu">
    <a href="/" class="active">Food Menu</a>
  </div>
</aside>

<div class="app-container">
  <header>
    <div class="header-top">
      <div class="header-left">
        <a href="/checkout.html" class="back-btn"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M15 18l-6-6 6-6"/></svg></a>
        <h2 style="margin:0; font-size:18px;">Bank Transfer</h2>
      </div>
    </div>
  </header>

  <main>
    <div class="bank-details-card">
      <button class="copy-btn" onclick="copyAccount()">Copy</button>
      <p style="margin:0 0 8px; font-size:13px; color:var(--text-muted); font-weight:600; text-transform:uppercase;">Send Payment To</p>
      <h2 style="margin:0 0 4px; font-size:24px; font-weight:900; color:var(--accent); letter-spacing:1px;">7084316433</h2>
      <p style="margin:0 0 16px; font-size:15px; font-weight:600;">Opay</p>
      <p style="margin:0; font-size:14px; color:var(--text-muted);">Account Name: <strong style="color:var(--text-main);">IDOWU STEPHEN TOMIWA</strong></p>
    </div>

    <div style="background:rgba(255,87,34,0.1); border:1px solid rgba(255,87,34,0.2); padding:16px; border-radius:12px; margin-bottom:24px;">
      <p style="margin:0; font-size:13px; color:var(--accent); font-weight:600; line-height:1.5;">⚠️ Please make sure you transfer the exact amount shown on the checkout page.</p>
    </div>

    <form id="paymentForm" onsubmit="handlePayment(event)">
      <div class="form-group">
        <label>Full Bank Name (Sender Name)</label>
        <input type="text" id="senderName" class="form-control" placeholder="e.g. IDOWU STEPHEN" required>
      </div>

      <div class="form-group">
        <label>Upload Payment Screenshot</label>
        <div class="upload-box" onclick="document.getElementById('fileInput').click()">
          <svg viewBox="0 0 24 24" width="32" height="32" stroke="var(--accent)" stroke-width="2" fill="none" style="margin-bottom:12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <p style="margin:0; font-weight:700; font-size:15px; color:var(--accent);" id="fileName">Tap to upload receipt</p>
        </div>
        <input type="file" id="fileInput" style="display:none;" accept="image/*" onchange="previewImage(this)">
      </div>

      <button type="submit" class="main-checkout-btn" style="margin-top:12px;">I Have Sent The Money</button>
    </form>
  </main>
</div>
<script src="/js/app.js"></script>
<script>
  let base64Image = "";

  function copyAccount() {
    navigator.clipboard.writeText("7084316433");
    const toast = document.getElementById('toast');
    toast.classList.add('show');
    setTimeout(() => { toast.classList.remove('show'); }, 3000);
  }

  function previewImage(input) {
    if (input.files && input.files[0]) {
      document.getElementById('fileName').textContent = input.files[0].name;
      const reader = new FileReader();
      reader.onload = function(e) {
        base64Image = e.target.result; // Save image as base64 string
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function handlePayment(e) {
    e.preventDefault();
    const sender = document.getElementById('senderName').value;
    
    if(!sender || sender.trim().split(' ').length < 2) {
      alert("Please enter your full bank name (First and Last name).");
      return;
    }
    if(!base64Image) {
      alert("Please upload a screenshot of your payment receipt.");
      return;
    }

    // 1. Get existing cart and user data
    const cart = JSON.parse(localStorage.getItem('cruDropCart_v2') || '[]');
    const totals = JSON.parse(localStorage.getItem('cruDropTotals_v2') || '{}');
    const user = JSON.parse(localStorage.getItem('cruDropUser') || '{}');
    
    if(cart.length === 0) {
      alert("Your cart is empty. Please go back and add items.");
      window.location.href = '/';
      return;
    }

    // 2. Generate Order Code
    const code = Math.floor(1000 + Math.random() * 9000).toString();

    // 3. Create the Order Object
    const newOrder = {
      code: code,
      type: 'food',
      status: 'pending',
      name: user.name || 'Student',
      phone: user.phone || 'N/A',
      hostel: user.hostel || 'Crawford',
      room: user.room || 'N/A',
      senderName: sender,
      total: totals.grandTotal,
      items: cart,
      receipt: base64Image,
      timestamp: Date.now()
    };

    // 4. Save to "Database" (localStorage)
    let orders = JSON.parse(localStorage.getItem('cruDropOrders') || '[]');
    orders.push(newOrder);
    localStorage.setItem('cruDropOrders', JSON.stringify(orders));

    // 5. Set tracker data
    localStorage.setItem('cruDropOrderCode', code);
    localStorage.setItem('cruDropVerifyEndTime', Date.now() + (5 * 60 * 1000)); // 5 mins from now

    // 6. Clear the cart so they can order again later
    localStorage.removeItem('cruDropCart_v2');
    localStorage.removeItem('cruDropTotals_v2');

    // 7. Redirect to Tracker
    window.location.href = '/order.html?code=' + code;
  }
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/js/sw.js')
        .then(registration => console.log('SW registered'))
        .catch(err => console.log('SW registration failed'));
    });
  }
</script>
</body>
</html>
