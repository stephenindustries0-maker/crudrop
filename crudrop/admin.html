<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard - CruDrop</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body { background: #0f172a; color: white; padding-bottom: 40px; display: flex; flex-direction: column; min-height: 100vh; font-family: 'Inter', sans-serif; }
  
  #lockScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
  .lock-box { background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 24px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .lock-icon { width: 64px; height: 64px; color: #ffd54f; margin-bottom: 20px; }
  .lock-box input { width: 100%; padding: 16px; background: #0f172a; border: 1px solid #334155; border-radius: 12px; color: white; font-size: 18px; text-align: center; letter-spacing: 2px; margin-bottom: 20px; outline: none; }
  .lock-box input:focus { border-color: #ffd54f; }
  .lock-box button { width: 100%; padding: 16px; background: #ffd54f; color: #000; border: none; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; }

  #dashboard { display: none; flex-direction: column; height: 100%; }
  .admin-header { background: #1e293b; padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
  .admin-title { margin: 0; font-size: 20px; font-weight: 900; color: #ffd54f; }
  
  .tabs { display: flex; gap: 10px; padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
  .tab { flex: 1; padding: 12px; text-align: center; background: #1e293b; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid #334155; }
  .tab.active { background: #ffd54f; color: #000; border-color: #ffd54f; }

  .admin-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .admin-card.pending { border-left: 4px solid #f59e0b; }
  .admin-card.verified { border-left: 4px solid #22C55E; opacity: 0.6; }
  .admin-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .admin-row strong { color: #94a3b8; }
  .admin-actions { display: flex; gap: 12px; margin-top: 16px; }
  .btn-approve { flex: 1; background: #22C55E; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
  .btn-reject { flex: 1; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; }
  .receipt-img { width: 100%; max-height: 200px; object-fit: contain; background: #000; border-radius: 8px; margin-top: 12px; display: block; }
  .no-orders { text-align: center; padding: 40px; color: #94a3b8; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-box">
    <svg class="lock-icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <h2 style="margin:0 0 10px;">Admin Access</h2>
    <input type="password" id="adminPassword" placeholder="••••••••" onkeypress="if(event.key === 'Enter') unlockAdmin()">
    <button onclick="unlockAdmin()">Unlock Dashboard</button>
  </div>
</div>

<div id="dashboard">
  <div class="admin-header">
    <h1 class="admin-title">CruDrop Admin</h1>
    <span id="orderCount" style="background:#ef4444; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:bold;">0 Pending</span>
  </div>
  
  <div class="tabs">
    <div class="tab active" onclick="switchTab('orders', this)">Orders</div>
    <div class="tab" onclick="switchTab('students', this)">Students</div>
    <div class="tab" onclick="switchTab('menu', this)">Menu</div>
  </div>

  <div style="padding: 0 20px; max-width: 600px; margin: 0 auto; width: 100%;">
    <!-- ORDERS TAB -->
    <div id="tab-orders">
      <div id="ordersContainer"></div>
    </div>

    <!-- STUDENTS TAB -->
    <div id="tab-students" style="display:none;">
      <div id="studentsContainer"></div>
    </div>

    <!-- MENU TAB -->
    <div id="tab-menu" style="display:none;">
      <div class="admin-card">
        <h3 style="margin:0 0 10px;">Menu Management</h3>
        <p style="color:#94a3b8; font-size:14px;">Menu editing is coming soon. Currently, menu items are hardcoded in the index.html file.</p>
      </div>
    </div>
  </div>
</div>

<script>
  const ADMIN_PASSWORD = "crudrop2026"; 
  let currentTab = 'orders';

  function unlockAdmin() {
    const input = document.getElementById('adminPassword').value;
    if(input === ADMIN_PASSWORD) {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      sessionStorage.setItem('cruDropAdminAuth', 'true');
      loadData();
    } else {
      alert("Incorrect password.");
    }
  }

  if(sessionStorage.getItem('cruDropAdminAuth') === 'true') {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
    loadData();
  }

  function switchTab(tab, element) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    element.classList.add('active');
    
    document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('tab-students').style.display = tab === 'students' ? 'block' : 'none';
    document.getElementById('tab-menu').style.display = tab === 'menu' ? 'block' : 'none';
    
    loadData();
  }

  async function loadData() {
    if(currentTab === 'orders') await loadOrders();
    if(currentTab === 'students') await loadStudents();
  }

  async function loadOrders() {
    const container = document.getElementById('ordersContainer');
    try {
      const response = await fetch('/api/get-orders');
      if(!response.ok) throw new Error("API failed");
      const orders = await response.json();
      
      const pendingCount = orders.filter(o => o.status === 'pending').length;
      document.getElementById('orderCount').textContent = pendingCount + " Pending";
      document.getElementById('orderCount').style.background = pendingCount > 0 ? "#ef4444" : "#22C55E";

      if(orders.length === 0) {
        container.innerHTML = '<div class="no-orders"><h3>No orders yet.</h3></div>';
        return;
      }

      container.innerHTML = orders.map(order => `
        <div class="admin-card ${order.status === 'pending' ? 'pending' : 'verified'}">
          <div class="admin-row"><strong>Code:</strong> <span style="color:#ffd54f; font-weight:900; font-size:18px;">${order.order_code}</span></div>
          <div class="admin-row"><strong>Student:</strong> ${order.full_name} (${order.phone})</div>
          <div class="admin-row"><strong>Address:</strong> ${order.hostel} Rm ${order.room}</div>
          <div class="admin-row"><strong>Sender Name:</strong> ${order.sender_name}</div>
          <div class="admin-row"><strong>Total Due:</strong> ₦${order.total_amount}</div>
          <div style="background:#0f172a; padding:12px; border-radius:8px; margin-top:12px; font-size:13px;">
            ${JSON.parse(order.items_json).map(i => `${i.qty}x ${i.name}`).join('<br>')}
          </div>
          ${order.receipt_url ? `<img src="${order.receipt_url}" class="receipt-img">` : ''}
          ${order.status === 'pending' ? `
            <div class="admin-actions">
              <button class="btn-reject" onclick="rejectOrder('${order.order_code}')">Reject</button>
              <button class="btn-approve" onclick="approveOrder('${order.order_code}')">Approve</button>
            </div>
          ` : `<div style="text-align:center; margin-top:16px; color:#22C55E; font-weight:800;">✓ Verified</div>`}
        </div>
      `).join('');
    } catch (err) {
      container.innerHTML = '<div class="no-orders"><h3>Error loading orders.</h3></div>';
    }
  }

  async function loadStudents() {
    const container = document.getElementById('studentsContainer');
    try {
      const response = await fetch('/api/get-students');
      if(!response.ok) throw new Error("API failed");
      const students = await response.json();
      
      if(students.length === 0) {
        container.innerHTML = '<div class="no-orders"><h3>No students registered yet.</h3></div>';
        return;
      }

      container.innerHTML = students.map(student => `
        <div class="admin-card">
          <div class="admin-row"><strong>Name:</strong> ${student.full_name}</div>
          <div class="admin-row"><strong>Phone:</strong> ${student.phone}</div>
          <div class="admin-row"><strong>Room:</strong> ${student.hostel} ${student.room}</div>
          <div class="admin-row"><strong>Points:</strong> ${student.points}</div>
          <div class="admin-row"><strong>Wallet:</strong> ₦${student.wallet_balance}</div>
        </div>
      `).join('');
    } catch (err) {
      container.innerHTML = '<div class="no-orders"><h3>Error loading students.</h3></div>';
    }
  }

  async function approveOrder(code) {
    try {
      await fetch('/api', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code: code, status: 'verified' })
      });
      loadOrders();
    } catch (err) { alert("Failed."); }
  }

  async function rejectOrder(code) {
    if(confirm("Reject payment?")) {
      try {
        await fetch('/api', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: code, status: 'rejected' })
        });
        loadOrders();
      } catch (err) { alert("Failed."); }
    }
  }

  setInterval(() => {
    if(sessionStorage.getItem('cruDropAdminAuth') === 'true' && currentTab === 'orders') {
      loadOrders();
    }
  }, 5000);
</script>
<script>
  // Register Service Worker for Push
  async function subscribeToPush() {
    const registration = await navigator.serviceWorker.register('/js/sw.js');
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: 'BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U' // Must match backend
    });

    await fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(subscription)
    });
    alert("Push Notifications Enabled!");
  }

  // Call this when Admin logs in
  document.getElementById('dashboard').style.display = 'flex';
  if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission().then(permission => {
      if(permission === "granted") subscribeToPush();
    });
  }
</script>
</html>
