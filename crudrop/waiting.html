<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifying - CruDrop</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="background:var(--bg-main); color:var(--text-main);">
<div class="app-container" style="justify-content: center; min-height: 100vh; padding-bottom: 0;">
  <main style="text-align: center; max-width: 400px; margin: 0 auto;">
    
    <div style="width: 80px; height: 80px; background: rgba(255,87,34,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
      <svg viewBox="0 0 24 24" width="40" height="40" stroke="var(--accent)" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </div>

    <h1 style="margin:0 0 12px; font-size: 26px; font-weight: 900;" id="waitTitle">Reviewing Payment</h1>
    <p style="margin:0 0 32px; font-size: 15px; color: var(--text-muted); line-height: 1.6;" id="waitMessage">
      We have received your transfer details.<br><br>
      Please wait <strong>5 minutes</strong> for us to review your payment. Do not close this page.
    </p>

    <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 32px;">
      <p style="margin:0 0 8px; font-size: 12px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Time Remaining</p>
      <div id="timerDisplay" style="font-size: 48px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: 2px;">05:00</div>
    </div>

    <a href="/" id="actionBtn" class="main-checkout-btn" style="text-decoration: none;">Back to Home</a>
  </main>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const type = urlParams.get('type');
  
  if(type === 'topup') {
    document.getElementById('waitTitle').textContent = "Verifying Top Up";
    document.getElementById('waitMessage').innerHTML = "We are reviewing your transfer.<br><br>Please wait <strong>5 minutes</strong> for us to credit your wallet.";
    document.getElementById('actionBtn').textContent = "Back to Wallet";
    document.getElementById('actionBtn').href = "/wallet.html";
  } else {
    const savedCode = localStorage.getItem('cruDropOrderCode') || '----';
    document.getElementById('actionBtn').textContent = "View Order Tracker";
    document.getElementById('actionBtn').href = "/order.html?code=" + savedCode;
  }

  let timeLeft = 300;
  const timerEl = document.getElementById('timerDisplay');

  const countdown = setInterval(() => {
    timeLeft--;
    
    const minutes = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const seconds = String(timeLeft % 60).padStart(2, '0');
    
    timerEl.textContent = `${minutes}:${seconds}`;
    
    if (timeLeft <= 0) {
      clearInterval(countdown);
      timerEl.textContent = "00:00";
      timerEl.style.color = "#22C55E"; 
      
      document.getElementById('waitTitle').textContent = "Payment Verified!";
      
      if(type === 'topup') {
         document.getElementById('waitMessage').innerHTML = "Your wallet has been credited. You can now use your balance to order food.";
      } else {
         document.getElementById('waitMessage').innerHTML = "Your payment has been confirmed. We are buying your food now!";
      }
    }
  }, 1000);
</script>
</body>
</html>
